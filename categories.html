<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Categories</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="title">Choose Hotel Type</h1>

    <div class="cards-container">

        <div class="hotel-card" onclick="goToRooms('luxury')">
            <h2>Luxury</h2>
            <p>High-end experience</p>
        </div>

        <div class="hotel-card" onclick="goToRooms('business')">
            <h2>Business</h2>
            <p>Perfect for work trips</p>
        </div>

        <div class="hotel-card" onclick="goToRooms('family')">
            <h2>Family</h2>
            <p>Comfort for families</p>
        </div>

        <div class="hotel-card" onclick="goToRooms('budget')">
            <h2>Budget</h2>
            <p>Affordable stays</p>
        </div>

        <div class="hotel-card" onclick="goToRooms('beach')">
            <h2>Beach</h2>
            <p>Relax by the sea</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
